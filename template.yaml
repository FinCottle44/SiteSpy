AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SiteSpy backend — Phase 0 (ingest path, data plane, credential store)

# ─────────────────────────────────────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────────────────────────────────────
Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
    Description: Deployment environment. Drives naming and some defaults.

  LogLevel:
    Type: String
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
    Default: INFO

  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID for dashboard authentication.
    Default: ""

  CognitoUserPoolClientId:
    Type: String
    Description: Cognito User Pool App Client ID for dashboard authentication.
    Default: ""

  DomainName:
    Type: String
    Description: Custom domain name for the API (prod only).
    Default: api.sitespy.io

  CertificateArn:
    Type: String
    Description: ACM certificate ARN for the custom domain (prod only, must be in same region).
    Default: ""

# ─────────────────────────────────────────────────────────────────────────────
# Conditions
# ─────────────────────────────────────────────────────────────────────────────
Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  HasCustomDomain: !And
    - !Condition IsProd
    - !Not [!Equals [!Ref CertificateArn, ""]]

# ─────────────────────────────────────────────────────────────────────────────
# Globals
# ─────────────────────────────────────────────────────────────────────────────
Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Architectures: [arm64]
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: sitespy
        POWERTOOLS_METRICS_NAMESPACE: SiteSpy
        LOG_LEVEL: !Ref LogLevel
        ENVIRONMENT: !Ref Environment
        SNAPSHOTS_BUCKET: !Ref SnapshotsBucket
        DATA_TABLE: !Ref DataTable
    Tags:
      Project: SiteSpy
      Environment: !Ref Environment

  Api:
    OpenApiVersion: 3.0.1

# ─────────────────────────────────────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────────────────────────────────────
Resources:

  # ── S3: snapshot storage ──────────────────────────────────────────────────
  # DeletionPolicy=Retain protects prod data. For dev cleanup, delete the
  # bucket manually after tearing down the stack.
  SnapshotsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub sitespy-${Environment}-snapshots-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToGlacierAfter1Year
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 365
          - Id: ExpireIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [GET]
            AllowedHeaders: ["*"]
            MaxAge: 300

  # ── DynamoDB: single-table design ─────────────────────────────────────────
  # PK / SK schema documented in requirements/multi-tenant-auth.md §3 and
  # requirements/api_contract.md (Flagged Cameras + image records).
  DataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub sitespy-${Environment}-data
      DeletionProtectionEnabled: !If [IsProd, true, false]
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: SiteSpy
        - Key: Environment
          Value: !Ref Environment

  # ── API Gateway: REST API with /v1/ prefix ────────────────────────────────
  SiteSpyApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub sitespy-${Environment}
      StageName: prod
      EndpointConfiguration:
        Type: REGIONAL
      BinaryMediaTypes:
        - image/jpeg
        - image/png
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true
      Cors:
        AllowMethods: "'GET,POST,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Correlation-Id'"
        AllowOrigin: "'*'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Correlation-Id'"
              Access-Control-Allow-Methods: "'GET,POST,PATCH,DELETE,OPTIONS'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Correlation-Id'"
              Access-Control-Allow-Methods: "'GET,POST,PATCH,DELETE,OPTIONS'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"
            Identity:
              Header: Authorization

  # ── Tenants Lambda ─────────────────────────────────────────────────────────
  TenantsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sitespy-${Environment}-tenants
      CodeUri: src/
      Handler: sitespy.handlers.tenants.handler
      Description: Lists all tenants (super admin only).
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DataTable
      Events:
        GetTenants:
          Type: Api
          Properties:
            RestApiId: !Ref SiteSpyApi
            Path: /v1/tenants
            Method: GET

  # ── Sites List Lambda ─────────────────────────────────────────────────────
  SitesListFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sitespy-${Environment}-sites-list
      CodeUri: src/
      Handler: sitespy.handlers.sites.handler_list
      Description: Returns all sites accessible to the caller.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DataTable
      Events:
        GetSites:
          Type: Api
          Properties:
            RestApiId: !Ref SiteSpyApi
            Path: /v1/sites
            Method: GET

  # ── Sites Lambda ──────────────────────────────────────────────────────────
  SitesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sitespy-${Environment}-sites
      CodeUri: src/
      Handler: sitespy.handlers.sites.handler
      Description: Returns site metadata and camera list for the dashboard.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DataTable
      Events:
        GetSite:
          Type: Api
          Properties:
            RestApiId: !Ref SiteSpyApi
            Path: /v1/sites/{site_id}
            Method: GET

  # ── Snapshots Latest Lambda ───────────────────────────────────────────────
  SnapshotsLatestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sitespy-${Environment}-snapshots-latest
      CodeUri: src/
      Handler: sitespy.handlers.snapshots.handler_latest
      Description: Returns the latest snapshot for each camera in a site.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:aws:s3:::${SnapshotsBucket}/*"
      Events:
        GetSnapshotsLatest:
          Type: Api
          Properties:
            RestApiId: !Ref SiteSpyApi
            Path: /v1/snapshots/latest
            Method: GET

  # ── Snapshots List Lambda ─────────────────────────────────────────────────
  SnapshotsListFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sitespy-${Environment}-snapshots-list
      CodeUri: src/
      Handler: sitespy.handlers.snapshots.handler_list
      Description: Returns a paginated list of snapshots for a camera.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:aws:s3:::${SnapshotsBucket}/*"
      Events:
        GetSnapshotsList:
          Type: Api
          Properties:
            RestApiId: !Ref SiteSpyApi
            Path: /v1/snapshots
            Method: GET

  # ── Flags POST Lambda ─────────────────────────────────────────────────────
  FlagsPostFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sitespy-${Environment}-flags-post
      CodeUri: src/
      Handler: sitespy.handlers.flags.handler_post
      Description: Raises a new flag on a camera.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        PostFlag:
          Type: Api
          Properties:
            RestApiId: !Ref SiteSpyApi
            Path: /v1/flags
            Method: POST

  # ── Flags GET Lambda ──────────────────────────────────────────────────────
  FlagsGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sitespy-${Environment}-flags-get
      CodeUri: src/
      Handler: sitespy.handlers.flags.handler_get
      Description: Lists flags scoped by caller role.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:aws:s3:::${SnapshotsBucket}/*"
      Events:
        GetFlags:
          Type: Api
          Properties:
            RestApiId: !Ref SiteSpyApi
            Path: /v1/flags
            Method: GET

  # ── Flags PATCH Lambda ────────────────────────────────────────────────────
  FlagsPatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sitespy-${Environment}-flags-patch
      CodeUri: src/
      Handler: sitespy.handlers.flags.handler_patch
      Description: Updates a flag status (acknowledge, resolve, dismiss).
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        PatchFlag:
          Type: Api
          Properties:
            RestApiId: !Ref SiteSpyApi
            Path: /v1/flags/{flag_id}
            Method: PATCH

  # ── Tenants POST Lambda ──────────────────────────────────────────────────
  TenantsPostFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sitespy-${Environment}-tenants-post
      CodeUri: src/
      Handler: sitespy.handlers.tenants_post.handler
      Description: Creates a new tenant (super admin only).
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        PostTenant:
          Type: Api
          Properties:
            RestApiId: !Ref SiteSpyApi
            Path: /v1/tenants
            Method: POST

  # ── Sites POST Lambda ──────────────────────────────────────────────────────
  SitesPostFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sitespy-${Environment}-sites-post
      CodeUri: src/
      Handler: sitespy.handlers.sites_post.handler
      Description: Registers a new site under a tenant (super admin only).
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        PostSite:
          Type: Api
          Properties:
            RestApiId: !Ref SiteSpyApi
            Path: /v1/sites
            Method: POST

  # ── Cameras POST Lambda ────────────────────────────────────────────────────
  CamerasPostFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sitespy-${Environment}-cameras-post
      CodeUri: src/
      Handler: sitespy.handlers.cameras_post.handler
      Description: Registers a new camera on a site and returns the ingest token (super admin only).
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        PostCamera:
          Type: Api
          Properties:
            RestApiId: !Ref SiteSpyApi
            Path: /v1/sites/{site_id}/cameras
            Method: POST

  # ── Users POST Lambda ──────────────────────────────────────────────────────
  UsersPostFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sitespy-${Environment}-users-post
      CodeUri: src/
      Handler: sitespy.handlers.users_post.handler
      Description: Creates a new user in a tenant (tenant admin or super admin).
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminGetUser
              Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"
      Events:
        PostUser:
          Type: Api
          Properties:
            RestApiId: !Ref SiteSpyApi
            Path: /v1/users
            Method: POST

  # ── Cameras GET Lambda ─────────────────────────────────────────────────────
  CamerasGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sitespy-${Environment}-cameras-get
      CodeUri: src/
      Handler: sitespy.handlers.cameras_get.handler
      Description: Lists all cameras for a site (tenant admin or super admin).
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DataTable
      Events:
        GetCameras:
          Type: Api
          Properties:
            RestApiId: !Ref SiteSpyApi
            Path: /v1/sites/{site_id}/cameras
            Method: GET

  # ── Cameras DELETE Lambda ──────────────────────────────────────────────────
  CamerasDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sitespy-${Environment}-cameras-delete
      CodeUri: src/
      Handler: sitespy.handlers.cameras_delete.handler
      Description: Deletes a camera from a site (super admin only).
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        DeleteCamera:
          Type: Api
          Properties:
            RestApiId: !Ref SiteSpyApi
            Path: /v1/sites/{site_id}/cameras/{camera_id}
            Method: DELETE

  # ── Users GET Lambda ─────────────────────────────────────────────────────────
  UsersGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sitespy-${Environment}-users-get
      CodeUri: src/
      Handler: sitespy.handlers.users_get.handler
      Description: Lists all users for a tenant (tenant admin or super admin).
      MemorySize: 256
      Timeout: 10
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DataTable
      Events:
        GetUsers:
          Type: Api
          Properties:
            RestApiId: !Ref SiteSpyApi
            Path: /v1/users
            Method: GET

  # ── Cameras Rotate Credentials Lambda ──────────────────────────────────────
  CamerasRotateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sitespy-${Environment}-cameras-rotate
      CodeUri: src/
      Handler: sitespy.handlers.cameras_rotate.handler
      Description: Rotates camera ingest token (tenant admin or super admin).
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        RotateCredentials:
          Type: Api
          Properties:
            RestApiId: !Ref SiteSpyApi
            Path: /v1/sites/{site_id}/cameras/{camera_id}/rotate-credentials
            Method: POST

  # ── Sites PATCH Lambda ────────────────────────────────────────────────────
  SitesPatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sitespy-${Environment}-sites-patch
      CodeUri: src/
      Handler: sitespy.handlers.sites_patch.handler
      Description: Updates site configuration (ingest hours). Tenant admin or super admin.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        PatchSite:
          Type: Api
          Properties:
            RestApiId: !Ref SiteSpyApi
            Path: /v1/sites/{site_id}
            Method: PATCH

  # ── Snapshots DELETE Lambda ───────────────────────────────────────────────
  SnapshotsDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sitespy-${Environment}-snapshots-delete
      CodeUri: src/
      Handler: sitespy.handlers.snapshots_delete.handler
      Description: Deletes snapshot captures (tenant admin or super admin).
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:DeleteObject
              Resource: !Sub "arn:aws:s3:::${SnapshotsBucket}/*"
      Events:
        DeleteSnapshots:
          Type: Api
          Properties:
            RestApiId: !Ref SiteSpyApi
            Path: /v1/snapshots
            Method: DELETE

  # ── Ingest Lambda ─────────────────────────────────────────────────────────
  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sitespy-${Environment}-ingest
      CodeUri: src/
      Handler: sitespy.handlers.ingest.handler
      Description: Receives JPEG snapshots from Axis cameras over HTTP Basic Auth.
      Timeout: 30
      MemorySize: 1024
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:PutObjectTagging
              Resource: !Sub "arn:aws:s3:::${SnapshotsBucket}/*"
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        IngestPost:
          Type: Api
          Properties:
            RestApiId: !Ref SiteSpyApi
            Path: /v1/ingest/{token}
            Method: POST
            Auth:
              Authorizer: NONE
            # No API Gateway authorizer — token auth is validated inside the Lambda.

  # ── Custom Domain (prod only) ─────────────────────────────────────────────
  ApiDomainName:
    Type: AWS::ApiGateway::DomainName
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref DomainName
      RegionalCertificateArn: !Ref CertificateArn
      EndpointConfiguration:
        Types:
          - REGIONAL
      SecurityPolicy: TLS_1_2
      Tags:
        - Key: Project
          Value: SiteSpy
        - Key: Environment
          Value: !Ref Environment

  ApiBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: HasCustomDomain
    DependsOn: SiteSpyApiprodStage
    Properties:
      DomainName: !Ref ApiDomainName
      RestApiId: !Ref SiteSpyApi
      Stage: prod

# ─────────────────────────────────────────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────────────────────────────────────────
Outputs:
  ApiEndpoint:
    Description: Base URL for the SiteSpy API (append /v1/... for routes).
    Value: !Sub https://${SiteSpyApi}.execute-api.${AWS::Region}.amazonaws.com/prod
    Export:
      Name: !Sub sitespy-${Environment}-api-endpoint

  CustomDomainUrl:
    Condition: HasCustomDomain
    Description: Custom domain URL for the SiteSpy API.
    Value: !Sub https://${DomainName}

  CustomDomainTarget:
    Condition: HasCustomDomain
    Description: CNAME target for Cloudflare DNS — point api.sitespy.io to this value.
    Value: !GetAtt ApiDomainName.RegionalDomainName

  IngestUrl:
    Description: Ingest URL template — replace {token} with the camera's ingest token.
    Value: !Sub https://${SiteSpyApi}.execute-api.${AWS::Region}.amazonaws.com/prod/v1/ingest/{token}

  SnapshotsBucketName:
    Value: !Ref SnapshotsBucket
    Export:
      Name: !Sub sitespy-${Environment}-snapshots-bucket

  DataTableName:
    Value: !Ref DataTable
    Export:
      Name: !Sub sitespy-${Environment}-data-table

  CognitoUserPoolId:
    Description: Cognito User Pool ID used for dashboard authentication.
    Value: !Ref CognitoUserPoolId
    Export:
      Name: !Sub sitespy-${Environment}-cognito-user-pool-id

  CognitoUserPoolClientId:
    Description: Cognito User Pool App Client ID used for dashboard authentication.
    Value: !Ref CognitoUserPoolClientId
    Export:
      Name: !Sub sitespy-${Environment}-cognito-user-pool-client-id
